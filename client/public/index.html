<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding for proper text display -->
    <meta charset="UTF-8">

    <!-- Makes the website responsive on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Short description used in search engines -->
    <meta 
        name="description"
        content="careChain - Emergency Blood and Organ Donation Management System"
    >

    <!-- Browser theme color for mobile devices -->
    <meta name="theme-color" content="#e63946">

    <!-- Enables web app mode on supported mobile browsers -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Website favicon -->
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">

    <!-- Apple device app icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png">

    <!-- Progressive Web App manifest file -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">

    <!-- Title shown in browser tab -->
    <title>careChain | Emergency Donation Platform</title>

</head>

<body>

    <!-- Displayed if JavaScript is disabled -->
    <noscript>
        JavaScript must be enabled to run careChain.
    </noscript>

    <!-- Root element where React injects the application -->
    <main id="root"></main>

</body>

</html>
