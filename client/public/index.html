<!DOCTYPE html>

<!-- 
    Main HTML document for careChain
    Emergency Blood and Organ Donation Management System
-->

<html lang="en">

<head>

    <!-- ========================================= -->
    <!-- Basic Page Configuration -->
    <!-- ========================================= -->

    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Ensures proper responsive behavior -->
    <meta 
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- ========================================= -->
    <!-- SEO and Browser Information -->
    <!-- ========================================= -->

    <!-- Website description for search engines -->
    <meta
        name="description"
        content="careChain - Emergency Blood and Organ Donation Management System"
    >

    <!-- Theme color for supported mobile browsers -->
    <meta
        name="theme-color"
        content="#e63946"
    >

    <!-- Enables standalone app-like experience -->
    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <!-- ========================================= -->
    <!-- Website Icons -->
    <!-- ========================================= -->

    <!-- Default browser favicon -->
    <link
        rel="icon"
        href="%PUBLIC_URL%/favicon.ico"
    >

    <!-- Apple touch icon for iOS devices -->
    <link
        rel="apple-touch-icon"
        href="%PUBLIC_URL%/logo192.png"
    >

    <!-- ========================================= -->
    <!-- Progressive Web App Settings -->
    <!-- ========================================= -->

    <!-- Web manifest configuration -->
    <link
        rel="manifest"
        href="%PUBLIC_URL%/manifest.json"
    >

    <!-- ========================================= -->
    <!-- Browser Tab Title -->
    <!-- ========================================= -->

    <title>
        careChain - Donation Emergency System
    </title>

</head>

<body>

    <!-- ========================================= -->
    <!-- JavaScript Disabled Warning -->
    <!-- ========================================= -->

    <noscript>
        You need to enable JavaScript to use careChain properly.
    </noscript>

    <!-- ========================================= -->
    <!-- React Application Mounting Point -->
    <!-- ========================================= -->

    <div id="root">

        <!-- 
            React application will be rendered here.
            All components are injected inside this div.
        -->

    </div>

</body>

</html>
